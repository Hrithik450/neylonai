name: Deploy Neylon AI

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 30m
          script: |
            set -e
            cd /srv/neylonai/app

            echo "==> Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "==> Building images and starting services..."
            docker compose up --build -d --remove-orphans

            echo "==> Running database schema push..."
            COMPOSE_PROFILES=migration docker compose run --rm migrator

            echo "==> Pruning unused Docker images..."
            docker image prune -f

            echo "==> Deployment complete!"

  publish-sdk:
    runs-on: ubuntu-latest
    needs: deploy

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check if SDK version changed
        id: sdk_version
        run: |
          LOCAL=$(node -p "require('./packages/sdk/package.json').version")
          REMOTE=$(npm view @neylonai/sdk version 2>/dev/null || echo "0.0.0")
          echo "local=$LOCAL" >> $GITHUB_OUTPUT
          echo "remote=$REMOTE" >> $GITHUB_OUTPUT
          if [ "$LOCAL" != "$REMOTE" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish SDK to npm
        if: steps.sdk_version.outputs.changed == 'true'
        run: pnpm --filter @neylonai/sdk publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
