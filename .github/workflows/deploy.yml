name: Deploy Neylon AI

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push web image
        run: |
          docker build \
            --target runner \
            -t "$ECR_REGISTRY/neylonai-web:${GITHUB_SHA}" \
            -t "$ECR_REGISTRY/neylonai-web:latest" \
            .

          docker push "$ECR_REGISTRY/neylonai-web:${GITHUB_SHA}"
          docker push "$ECR_REGISTRY/neylonai-web:latest"

      - name: Build and push crawler image
        run: |
          docker build \
            --target crawler \
            -t "$ECR_REGISTRY/neylonai-crawler:${GITHUB_SHA}" \
            -t "$ECR_REGISTRY/neylonai-crawler:latest" \
            .

          docker push "$ECR_REGISTRY/neylonai-crawler:${GITHUB_SHA}"
          docker push "$ECR_REGISTRY/neylonai-crawler:latest"

      - name: Deploy to EC2 through SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",
              "echo \"Setting up application directory...\"",
              "sudo mkdir -p /srv/neylonai",
              "if [ ! -d /srv/neylonai/app ]; then",
              "  echo \"Cloning repository...\"",
              "  sudo git clone https://github.com/Hrithik450/neylonai.git /srv/neylonai/app",
              "  sudo chown -R $(whoami):$(whoami) /srv/neylonai/app",
              "fi",
              "cd /srv/neylonai/app",
              "echo \"Updating repository...\"",
              "git fetch origin main",
              "git reset --hard origin/main",
              "echo \"Logging into ECR...\"",
              "aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${ECR_REGISTRY}",
              "echo \"Pulling latest images...\"",
              "docker compose -f docker-compose.yml pull",
              "echo \"Starting services...\"",
              "docker compose -f docker-compose.yml up -d",
              "echo \"Cleaning up old images...\"",
              "docker image prune -f",
              "echo \"Deployment completed successfully!\""
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Wait for command to complete (success or failure)
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" || true

          # Get the full command output
          INVOCATION=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}")

          echo "$INVOCATION"

          # Check status and fail if command failed
          STATUS=$(echo "$INVOCATION" | jq -r '.Status')
          if [ "$STATUS" != "Success" ]; then
            echo "::error::Deployment command failed with status: $STATUS"
            echo "Standard Output:"
            echo "$INVOCATION" | jq -r '.StandardOutputContent'
            echo "Standard Error:"
            echo "$INVOCATION" | jq -r '.StandardErrorContent'
            exit 1
          fi
          
          echo "Deployment completed successfully!"
