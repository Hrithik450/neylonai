# Neylon AI — Nginx reverse proxy for neylonai.mhritihk.com
# Managed by: /srv/neylonai/app/nginx/neylonai.conf
# Symlinked to: /etc/nginx/sites-enabled/neylonai

# Redirect bare HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name neylonai.mhritihk.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — proxy to Next.js on 127.0.0.1:3000
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name neylonai.mhritihk.com;

    ssl_certificate     /etc/letsencrypt/live/neylonai.mhritihk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/neylonai.mhritihk.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options           "SAMEORIGIN"   always;
    add_header X-Content-Type-Options    "nosniff"      always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    client_max_body_size 50m;

    # Next.js app
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Cache Next.js static assets
    location /_next/static/ {
        proxy_pass       http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
