# App-only stack for VPS/EC2 when Postgres + Redis are managed in the cloud
# (Neon, RDS, Upstash, etc.). No local DB containers.
#
# 1. Point DATABASE_URL / REDIS_URL / DATABASE_SSL at your cloud providers in .env
# 2. Migrate from the host:  pnpm db:migrate
# 3. docker compose -f docker-compose.cloud.yml up --build

name: neylonai-cloud

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    ports:
      - "3000:3000"
    restart: unless-stopped

  crawler:
    build:
      context: .
      dockerfile: Dockerfile
      target: crawler
    env_file:
      - .env
    environment:
      NODE_ENV: production
    restart: unless-stopped
