# Full self-hosted stack — Postgres + Redis + app, all built and run on the server.
# No external registries (ECR/Docker Hub) are used; images are built from source.
#
# First-time server setup:  bash scripts/setup-server.sh
# Deploy / update:          bash scripts/deploy.sh
#
# Manual steps:
#   1. cp .env.example .env  (fill in real secrets)
#   2. docker compose up --build -d

name: neylonai

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: neylonai
      POSTGRES_PASSWORD: neylonai
      POSTGRES_DB: neylonai
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neylonai -d neylonai"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrator:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://neylonai:neylonai@postgres:5432/neylonai
      DATABASE_SSL: "false"
    depends_on:
      postgres:
        condition: service_healthy
    # Runs once and exits — not a long-lived service
    profiles:
      - migration
    restart: "no"

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_NEYLONAI_API_ORIGIN: ${NEXT_PUBLIC_NEYLONAI_API_ORIGIN:-}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_NEYLONAI_API_KEY: ${NEXT_PUBLIC_NEYLONAI_API_KEY:-}
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgresql://neylonai:neylonai@postgres:5432/neylonai
      DATABASE_SSL: "false"
      REDIS_URL: redis://redis:6379
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  crawler:
    build:
      context: .
      dockerfile: Dockerfile
      target: crawler
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://neylonai:neylonai@postgres:5432/neylonai
      DATABASE_SSL: "false"
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
